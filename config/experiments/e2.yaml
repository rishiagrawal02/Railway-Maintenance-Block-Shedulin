# E2: Scalability Study
# Runtime vs problem size n on log-log axes; runs while ILP can still solve.
id: e2
description: "Scalability: runtime vs n for all algorithms, log-log analysis."
instance_kind: extended
seed_kind: evaluation
seeds: [2000, 2001, 2002, 2003, 2004]
sizes: [50, 100, 200, 500, 1000, 2000, 5000]
knob_levels:
  - label: "default"
    params: {}
algorithms:
  - NAIVE-GREEDY
  - CA-GREEDY
  - ILP-EXACT
ilp_time_limit: 60             # shorter limit; ILP included only while it can solve
deterministic_time_limit: null
